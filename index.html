<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Agenda Aish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #F7F6F2; --panel: #FFFFFF; --fg: #1F2A33; --muted: #5E6A73; --line: #DEDAD0; --slate: #4A5F73; --danger: #A23B2F;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --display: "Space Grotesk", "Inter", system-ui, sans-serif; --r: 8px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #171B1F; --panel: #20262C; --fg: #ECE8DF; --muted: #A3ACB3; --line: #333B43; --slate: #9DB3C7; --danger: #EE8A7C; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #171B1F; --panel: #20262C; --fg: #ECE8DF; --muted: #A3ACB3; --line: #333B43; --slate: #9DB3C7; --danger: #EE8A7C; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; display: grid; place-items: center; padding: 24px 16px; }
.caja { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); line-height: 1.45; }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: .9rem; }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--fg); }
input:focus { outline: 2px solid var(--slate); outline-offset: 1px; }
button { font: inherit; font-weight: 600; padding: 11px 14px; border: 0; border-radius: var(--r); background: var(--slate); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
</style>
</head>
<body>
<form class="caja" id="f" autocomplete="on">
  <h1>Agenda Aish</h1>
  <p>Eventos, jaguim y clases de Aish Chile. Entra con tu correo y tu clave.</p>
  <label>Correo<input id="c" type="email" name="email" autocomplete="username" required></label>
  <label>Clave<input id="k" type="password" name="password" autocomplete="current-password" required></label>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
(function () {
  var ITERS = 600000, VER = "f148c60b9f";
  function hx(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function th(b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }
  function b64(s) { var t = atob(s), a = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) a[i] = t.charCodeAt(i); return a; }
  async function abrir(kh) {
    var key = await crypto.subtle.importKey("raw", hx(kh), "AES-GCM", false, ["decrypt"]);
    var buf = await (await fetch("d/agenda.bin?v=" + VER, { cache: "no-store" })).arrayBuffer();
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)));
    document.open(); document.write(html); document.close();
  }
  var guardada = null; try { guardada = sessionStorage.getItem("ag-k"); } catch (e) {}
  if (guardada) abrir(guardada).catch(function () { try { sessionStorage.removeItem("ag-k"); } catch (e) {} location.reload(); });
  var f = document.getElementById("f"), b = document.getElementById("b"), e = document.getElementById("e");
  f.addEventListener("submit", async function (ev) {
    ev.preventDefault(); e.textContent = ""; b.disabled = true; b.textContent = "Entrando…";
    try {
      var correo = document.getElementById("c").value.trim().toLowerCase(), clave = document.getElementById("k").value;
      var id = th(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("agenda-aish:" + correo))).slice(0, 32);
      var us = await (await fetch("d/u.json?v=" + VER, { cache: "no-store" })).json(), u = us[id];
      if (!u) throw 0;
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
      var kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: hx(u.s), iterations: ITERS, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var w = b64(u.w), k = await crypto.subtle.decrypt({ name: "AES-GCM", iv: w.slice(0, 12) }, kek, w.slice(12));
      var kh = th(k); try { sessionStorage.setItem("ag-k", kh); } catch (x) {}
      await abrir(kh);
    } catch (x) { e.textContent = "El correo o la clave no son correctos."; b.disabled = false; b.textContent = "Entrar"; }
  });
})();
</script>
</body>
</html>
